name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read
  id-token: write

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish verified package
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Verify tag matches package version
        shell: bash
        run: test "${GITHUB_REF_NAME}" = "v$(node -p "require('./package.json').version")"
      - run: npm ci
      - run: npm run release:check
      - name: Publish
        run: npm publish --access public --provenance
        env:
          # Trusted publishing uses the job's OIDC token. This optional secret
          # keeps the workflow usable until the npm trusted publisher is linked.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
