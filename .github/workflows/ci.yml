name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  release-check:
    name: Node ${{ matrix.node }} release check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run release:check
